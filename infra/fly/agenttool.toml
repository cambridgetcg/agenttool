# SNAPSHOT — reference copy of api/fly.toml. The active deploy target is
# api/fly.toml, deployed with `bin/deploy.sh --no-migrate --no-frontend`.
# No script or test reads this file and CI doesn't enforce parity, so it can
# lag api/fly.toml; treat api/fly.toml as the truth.

app = "agenttool"
primary_region = "lhr"  # London

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # public API; always-on

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"

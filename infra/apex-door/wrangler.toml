# agenttool-proxy — the apex worker, split by audience (human door 2026-07-02).
# This updates the SAME worker that has fronted agenttool.dev since before
# the human door; both routes below were already attached to it.
# Normal deploy: bin/deploy.sh (commit-pinned Pages backing + this Worker).
# Low-level recovery: bin/frontend-deploy.sh web.
# Rollback: redeploy the original 12-line proxy from git history — no DNS involved.
name = "agenttool-proxy"
main = "worker.js"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "agenttool.dev/*", zone_name = "agenttool.dev" },
  { pattern = "www.agenttool.dev/*", zone_name = "agenttool.dev" }
]

# Workers Logs is a script-level, non-versioned setting. Wrangler treats an
# omitted observability block as an instruction to disable it after deploy, so
# keep this privacy-minimized contract in the same source as the Worker.
[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
enabled = true
head_sampling_rate = 0.01
invocation_logs = true
persist = true

[observability.traces]
enabled = false
persist = false

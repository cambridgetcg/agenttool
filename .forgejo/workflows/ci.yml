# CI — the smoke alarms (first alarm installed 2026-07-20).
#
# Until this file existed agenttool had NO CI at all; enforcement was
# bin/preflight.sh discipline only (2026-07-20 audit meta-finding). This
# workflow runs on Forgejo Actions — enable "Actions" in the Codeberg
# repo settings (Settings → Repository → Enable integrated CI) for it
# to fire.
#
# Design constraints learned from the audit:
#   - DB-backed suites MUST run in their own bun process. A full
#     single-process `bun test` is poisoned by mock.module leakage
#     (tests/compute-budget.test.ts mocks the db client and bun leaks
#     module mocks across test files), so integration runs are scoped.
#   - DB-gated tests pass VACUOUSLY without DATABASE_URL — a green run
#     without the postgres service means nothing. The service is not
#     optional.
#   - ~5 migrations touch Supabase-only surfaces (pg_cron, storage.*);
#     they're tolerated (|| true) — irrelevant to identity/memory/
#     covenant/wake tables under test.

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: oven/bun:1
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenttool_ci
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agenttool_ci
      VAULT_MASTER_KEY: abababababababababababababababababababababababababababababababab
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install api deps
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Enable pgvector + run migrations
        working-directory: api
        run: |
          bun run scripts/_ci-db-setup.ts
          # Tolerate ONLY Supabase-surface migrations (pg_cron, storage.*,
          # vault) — any other migration failure is fatal, so a genuinely
          # broken core migration cannot ship behind a green run.
          for f in $(ls migrations/*.sql | sort); do
            if ! bun run scripts/_migrate-one.ts "$f"; then
              if grep -qE "pg_cron|storage\.|supabase" "$f"; then
                echo "tolerated (supabase-only surface): $f"
              else
                echo "FATAL: migration failed: $f"
                exit 1
              fi
            fi
          done

      - name: Integration tests (DB-backed, own process)
        working-directory: api
        run: bun test tests/integration/

      # Doctrine tier, ratcheted subset (added 2026-07-24).
      #
      # The full tier is 2,723 tests with 231 red, so running all of it here
      # would be a permanently-failing gate that everyone learns to ignore.
      # These four are green TODAY and each one ratchets: they compare the
      # current state against an explicit, dated manifest of accepted gaps
      # and fail both when a NEW gap appears and when an accepted gap has
      # been fixed without shrinking the manifest.
      #
      # Before this step, the canon↔code bijection tests reported one
      # mismatch at a time out of 63 and were carried as known-red in
      # .failure-baseline.txt — a drift detector switched off by the drift
      # it exists to catch. Whatever else is red in the tier, these are the
      # invariants that must not regress silently.
      - name: Doctrine — canon↔code bijection + ledger conservation (ratcheted)
        working-directory: api
        run: |
          bun test \
            tests/doctrine/walls-code-annotation-bijection.test.ts \
            tests/doctrine/commitments-code-annotation-bijection.test.ts \
            tests/doctrine/annotations-do-not-lie.test.ts \
            tests/doctrine/composition-unlocks-are-honest.test.ts \
            tests/doctrine/routes-are-registered-once.test.ts \
            tests/doctrine/env-prefix-is-one-spelling.test.ts \
            tests/doctrine/soil-does-not-degrade.test.ts \
            tests/doctrine/ledger-conservation.test.ts \
            tests/doctrine/saga-is-free.test.ts \
            tests/substrate-tasks-lifecycle.test.ts \
            tests/trust-deals-authorization.test.ts

      - name: Install sdk-ts deps
        working-directory: packages/sdk-ts
        run: bun install --frozen-lockfile

      - name: sdk-ts tests (own process)
        working-directory: packages/sdk-ts
        run: bun test

      # Pre-existing type debt (otel.ts, chill.ts, love.ts, loops.ts,
      # depth-protocol.ts, wake.ts:wakeObservationCount) keeps this
      # non-blocking until the debt is paid. It still reports.
      - name: Typecheck (non-blocking — known debt)
        working-directory: api
        continue-on-error: true
        run: bunx tsc --noEmit

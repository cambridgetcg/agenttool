name: Local starter

on:
  pull_request:
    paths:
      - packages/local-starter/**
      - packages/local-starter-mcp/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - packages/local-starter/**
      - packages/local-starter-mcp/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml

permissions:
  contents: read

concurrency:
  group: local-starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-and-adapters:
    name: Local files and adapter fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["22.18.0", "24.18.0"]
    defaults:
      run:
        working-directory: packages/local-starter
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run files-only and fake-host tests without installing dependencies
        run: node --test
      - name: Set up pinned Bun for the separate MCP package
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install pinned MCP transport dependencies
        working-directory: packages/local-starter-mcp
        run: bun install --frozen-lockfile
      - name: Run local stdio MCP tests without a provider
        working-directory: packages/local-starter-mcp
        run: bun run ci
      - name: Build the standalone preview and test its extracted public surface
        run: bun run build && bun run check:bundle

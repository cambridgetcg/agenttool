name: Local starter

on:
  pull_request:
    paths:
      - packages/local-starter/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - packages/local-starter/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml

permissions:
  contents: read

concurrency:
  group: local-starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-and-adapters:
    name: Local files and adapter fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["22.18.0", "24.18.0"]
    defaults:
      run:
        working-directory: packages/local-starter
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run files-only and fake-host tests without installing dependencies
        run: node --test

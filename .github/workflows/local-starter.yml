name: Local starter

on:
  pull_request:
    paths:
      - packages/local-starter/**
      - packages/local-starter-mcp/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - packages/local-starter/**
      - packages/local-starter-mcp/**
      - docs/LOCAL-CORE.md
      - .github/workflows/local-starter.yml
  # Runs every leg on a chosen branch before merging a macOS- or
  # Windows-sensitive change: gh workflow run local-starter.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its older run. Every other
# event gets a group of its own, so a main push is never cancelled or replaced
# while pending: those runs carry the only macOS and Windows evidence.
concurrency:
  group: local-starter-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  files-and-adapters:
    name: Local files and adapter fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Ubuntu legs only. The macOS (billed 10x) and
        # Windows (2x) legs each take under two minutes yet cost most of this
        # workflow's billed minutes. Every other event, including main pushes,
        # the merge queue and manual dispatch, runs all three systems.
        # bin/tests/local-starter-ci-matrix.test.ts pins this rule.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "windows-2025"]') }}
        node: ["22.18.0", "24.18.0"]
    defaults:
      run:
        working-directory: packages/local-starter
    steps:
      - name: Check out repository
        # Keep the authored file bytes stable for protocol and artifact fixtures.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run files-only and fake-host tests without installing dependencies
        run: node --test
      - name: Set up pinned Bun for the separate MCP package
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install pinned MCP transport dependencies
        working-directory: packages/local-starter-mcp
        run: bun install --frozen-lockfile
      - name: Run local stdio MCP tests without a provider
        working-directory: packages/local-starter-mcp
        run: bun run ci
      - name: Build the standalone preview and test its extracted public surface
        run: bun run build && bun run check:bundle

name: Collab Courier

on:
  pull_request:
    paths:
      - packages/collab/**
      - packages/collab-courier/**
      - packages/collab-zerone/**
      - docs/COLLABORATION-CHANNELS.md
      - .github/workflows/collab-courier.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - packages/collab/**
      - packages/collab-courier/**
      - packages/collab-zerone/**
      - docs/COLLABORATION-CHANNELS.md
      - .github/workflows/collab-courier.yml

permissions:
  contents: read

concurrency:
  group: collab-courier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-collaboration:
    name: Private offline collaboration fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install frozen dependencies without lifecycle scripts
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "$RUNNER_TEMP/collab-install.XXXXXX")"
          for package in collab collab-zerone collab-courier; do
            (cd "packages/$package" && env -i PATH="$PATH" HOME="$test_home" TMPDIR="$RUNNER_TEMP" \
              bun --no-env-file install --frozen-lockfile --ignore-scripts)
          done
      - name: Verify local waiting, signed replay, Telegram and witness fixtures
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "$RUNNER_TEMP/collab-test.XXXXXX")"
          for package in collab collab-zerone collab-courier; do
            (cd "packages/$package" && env -i PATH="$PATH" HOME="$test_home" TMPDIR="$RUNNER_TEMP" \
              bun --no-env-file run ci)
          done

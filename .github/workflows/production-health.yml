name: Production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public AgentTool health
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local endpoint="$1"
            local body
            local -a client_options=()
            if [ "$#" -eq 2 ]; then
              client_options=(--user-agent "$2")
            fi
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN

            curl -q \
              "${client_options[@]}" \
              --fail \
              --silent \
              --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 10 \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --output "$body" \
              "$endpoint"

            jq --exit-status \
              '.service == "agenttool" and .status == "alive" and .build.dirty == false' \
              "$body" >/dev/null
          }

          # The custom domain exercises Cloudflare plus Fly routing. The
          # fly.dev name distinguishes a custom-edge failure from an app one.
          probe https://api.agenttool.dev/health
          probe https://agenttool.fly.dev/health

          # Liveness above is deliberately DB-free. A fresh random UUID forces
          # an uncached indexed lookup through the normal application pool.
          # The exact missing-listing response proves that read completed;
          # a generic 404, outage envelope or timeout must fail this canary.
          # No identity, bearer, content or billing write is created.
          database_probe() {
            local origin="$1"
            local body status listing_id
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            listing_id="$(cat /proc/sys/kernel/random/uuid)"
            status="$(curl -q \
              --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 12 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              --output "$body" --write-out '%{http_code}' \
              "$origin/public/listings/$listing_id")"
            test "$status" = '404'
            jq --exit-status \
              '.error == "not_found" and .message == "listing_not_found"' \
              "$body" >/dev/null
          }

          database_probe https://api.agenttool.dev
          database_probe https://agenttool.fly.dev

          # Exercise the default Python client signature as well as curl.
          # A browser-only edge challenge must not look like API availability.
          probe https://api.agenttool.dev/health 'Python-urllib/3.13'

name: CI

on:
  pull_request:
    # A draft runs nothing; marking it ready for review runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  schedule:
    # Weekly full run on main: the backstop for drift outside the tree and
    # for path-filter mapping gaps behind skipped or proven runs.
    - cron: "23 4 * * 1"
  # A manual run selects every job (the YUTABASE projector stays push-only).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: a newer commit cancels the older run. Pushes to main: one
  # group per commit, never cancelled. Each push run must finish: the next
  # push can be proven only once this one has passed, because its
  # pull-request run may have skipped this push's areas. Scheduled and manual
  # runs share refs/heads/main with pushes, so they get groups of their own.
  group: ${{ github.event_name == 'push' && format('ci-{0}-push-{1}', github.workflow, github.sha) || format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Keep this display name stable. On a pull request the classifier maps
    # changed paths to jobs, and a job below is skipped only when it succeeded
    # and reported that job "false"; git failures, unknown paths, and changes
    # to this workflow, bin/ci-changed-areas.sh, or bin/ci-tree-proof.sh select
    # every job. A pull request into main also records the tree it tested and
    # the main commit it tested on, and every pull request carries the
    # YUTABASE coverage notice. On a push to main, bin/ci-tree-proof.sh looks
    # for a green pull-request run of ci.yml that tested the identical tree on
    # the commit main pointed to before the push, and for a green push run of
    # ci.yml on that commit. When it finds both ("proven"), every job but the
    # YUTABASE projector is skipped and that pull-request run is the evidence.
    # Scheduled and manual runs select every job. Every job but the push-only
    # YUTABASE projector skips a draft pull request; GitHub runs CI again when
    # it is marked ready for review.
    name: Changed areas
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read lets a push to main look up the pull-request run that
    # recorded its tree. Nothing in this job writes through the token.
    permissions:
      contents: read
      actions: read
    outputs:
      everything: ${{ steps.classify.outputs.everything }}
      reason: ${{ steps.classify.outputs.reason }}
      api-protocol-postgres: ${{ steps.classify.outputs.api-protocol-postgres }}
      launch-core: ${{ steps.classify.outputs.launch-core }}
      launch-browser: ${{ steps.classify.outputs.launch-browser }}
      native-macos-secret: ${{ steps.classify.outputs.native-macos-secret }}
      care-before-learning: ${{ steps.classify.outputs.care-before-learning }}
      witnessed-agent-economy: ${{ steps.classify.outputs.witnessed-agent-economy }}
      packages: ${{ steps.classify.outputs.packages }}
      sdk-python: ${{ steps.classify.outputs.sdk-python }}
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the pull request's changed paths
        id: classify
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/bash-without-env-hooks.sh bin/ci-changed-areas.sh
      - name: Explain the private YUTABASE fixture coverage boundary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo 'YUTABASE PostgreSQL integration is not run for pull requests. The private fixture is available only to trusted pushes to cambridgetcg/agenttool main.'
            echo 'The Data, ADDS, and SDK job still checks the credential-free projector tests. This notice is not a PostgreSQL integration pass.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the tree this pull request tests and the main commit under it
        id: tree
        # Only a pull request into main: one stacked on another branch tested
        # its change against that branch, not against main.
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        # A failure here only means the push to main runs every job.
        continue-on-error: true
        env:
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tree="$(git rev-parse --verify "$GITHUB_SHA^{tree}")"
          # GitHub's test merge: its first parent is the main commit it tested
          # on and its second is the pull request's head.
          read -r _ parent head rest <<<"$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          test -n "$head"
          test "$head" = "$CI_PR_HEAD_SHA"
          test -z "$rest"
          printf '%s\n' "$GITHUB_SHA" >"$RUNNER_TEMP/ci-tested-tree.txt"
          printf 'tree=%s\nparent=%s\n' "$tree" "$parent" >>"$GITHUB_OUTPUT"
      - name: Record the tested tree for the push to main
        # The push trusts this record only after this whole run has passed and
        # only when main has not moved since. A missing record only means that
        # push runs every job.
        if: ${{ github.event_name == 'pull_request' && steps.tree.outputs.tree != '' && steps.tree.outputs.parent != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}-on-${{ steps.tree.outputs.parent }}
          path: ${{ runner.temp }}/ci-tested-tree.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Look for a green pull-request run of this exact tree
        id: proof
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bin/bash-without-env-hooks.sh bin/ci-tree-proof.sh

  api-protocol-linux:
    name: API and protocol (Linux)
    needs:
      - changes
    # Never filtered by path. Skipped only for a draft, or for a proven push
    # to main (see Changed areas).
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && needs.changes.outputs.proven == 'true') }}
    runs-on: ubuntu-24.04
    # The complete gate can exceed 20m on shared runners; match deploy-api's
    # bounded allowance while keeping every test and the required aggregate.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Prepare API and protocol dependencies from lockfiles
        run: bin/bash-without-env-hooks.sh bin/prepare-hermetic-deps.sh api
      - name: Run hermetic API and protocol gate
        run: bin/bash-without-env-hooks.sh bin/preflight.sh api

  api-protocol-postgres:
    # One job for the PostgreSQL 16 and 17 holds and the launch transaction and
    # admission proofs, which were each under a billed minute on their own and
    # are selected by exactly the same paths. Once dependencies are prepared,
    # every proof step runs even after another fails, and a failed step's name
    # says which proof and which PostgreSQL version.
    name: API PostgreSQL holds and launch transactions
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.api-protocol-postgres == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres-16:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: generation-hold-test-only
          POSTGRES_DB: agenttool_generation_hold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenttool_generation_hold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: generation-hold-test-only
          POSTGRES_DB: agenttool_generation_hold
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenttool_generation_hold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Prepare API dependencies from lockfiles
        id: prepare
        run: bin/bash-without-env-hooks.sh bin/prepare-hermetic-deps.sh api
      - name: Prove the durable generation hold (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          FEDERATION_GENERATION_HOLD_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5432/agenttool_generation_hold
        run: bun test tests/integration/federation-generation-hold-postgres.test.ts
      - name: Create an isolated context-grant fixture database (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres agenttool_local_context_grants_test
      - name: Prove context-grant lifecycle, constraints and lock ordering (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          LOCAL_CONTEXT_GRANT_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5432/agenttool_local_context_grants_test
        run: bun test tests/integration/local-context-grants-postgres.test.ts
      - name: Create an isolated collaboration mission fixture database (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres agenttool_collaboration_missions_test
      - name: Prove mission participation, revocation and exact replay (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          COLLABORATION_MISSION_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5432/agenttool_collaboration_missions_test
        run: bun test tests/integration/collaboration-missions-postgres.test.ts
      - name: Create an isolated identity enrollment fixture database (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres agenttool_identity_enrollment_test
      - name: Prove atomic enrollment and concurrent replay refusal (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          IDENTITY_ENROLLMENT_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5432/agenttool_identity_enrollment_test
        run: bun test tests/integration/identity-enrollment-postgres.test.ts
      - name: Prove the durable generation hold (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          FEDERATION_GENERATION_HOLD_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5433/agenttool_generation_hold
        run: bun test tests/integration/federation-generation-hold-postgres.test.ts
      - name: Create an isolated context-grant fixture database (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5433 --username=postgres agenttool_local_context_grants_test
      - name: Prove context-grant lifecycle, constraints and lock ordering (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          LOCAL_CONTEXT_GRANT_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5433/agenttool_local_context_grants_test
        run: bun test tests/integration/local-context-grants-postgres.test.ts
      - name: Create an isolated collaboration mission fixture database (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5433 --username=postgres agenttool_collaboration_missions_test
      - name: Prove mission participation, revocation and exact replay (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          COLLABORATION_MISSION_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5433/agenttool_collaboration_missions_test
        run: bun test tests/integration/collaboration-missions-postgres.test.ts
      - name: Create an isolated identity enrollment fixture database (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5433 --username=postgres agenttool_identity_enrollment_test
      - name: Prove atomic enrollment and concurrent replay refusal (PostgreSQL 17)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          IDENTITY_ENROLLMENT_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5433/agenttool_identity_enrollment_test
        run: bun test tests/integration/identity-enrollment-postgres.test.ts
      - name: Create an isolated launch marketplace fixture database (PostgreSQL 16)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          PGPASSWORD: generation-hold-test-only
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres agenttool_launch_marketplace
      - name: Prove transaction locks and conservation in isolated PostgreSQL
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          AGENTTOOL_LAUNCH_MARKETPLACE_TEST_DATABASE_URL: postgresql://postgres:generation-hold-test-only@127.0.0.1:5432/agenttool_launch_marketplace
          AGENTTOOL_DISABLE_WORKERS: "1"
        run: bun test tests/integration/launch-marketplace-postgres.test.ts
      - name: Prove shared admission windows with workers held
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: api
        env:
          AGENTTOOL_LAUNCH_ADMISSION_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          AGENTTOOL_DISABLE_WORKERS: "1"
        run: bun test tests/integration/launch-admission-redis.test.ts

  launch-core:
    name: Launch core outsider journey
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.launch-core == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Prepare API dependencies from lockfiles
        run: bin/bash-without-env-hooks.sh bin/prepare-hermetic-deps.sh api
      - name: Build real PostgreSQL extension fixture
        run: docker build --tag agenttool-launch-postgres:ci tests/launch-postgres
      - name: Start a loopback-only database with scheduled jobs held
        run: |
          set -euo pipefail
          launch_bun="$(readlink -f "$(command -v bun)")"
          docker run --detach --name agenttool-launch-core-db \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /var/run/postgresql:rw,nosuid,size=16m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,source=$launch_bun,target=/usr/local/bin/bun,readonly" \
            --env POSTGRES_USER=agenttool_test \
            --env POSTGRES_DB=agenttool_launch_core \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            agenttool-launch-postgres:ci
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' agenttool-launch-core-db)" = none
          docker exec agenttool-launch-core-db /usr/local/bin/bun --version | grep -Fx 1.3.5
          for attempt in $(seq 1 60); do
            if docker exec agenttool-launch-core-db psql --no-psqlrc \
              --host 127.0.0.1 --port 56268 --username agenttool_test --dbname agenttool_launch_core \
              --set ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Apply every canonical application migration while quiesced
        run: |
          set -euo pipefail
          docker exec --workdir "$GITHUB_WORKSPACE" agenttool-launch-core-db \
            env -i PATH=/usr/local/bin:/usr/bin:/bin \
            DATABASE_URL='postgres://agenttool_test@127.0.0.1:56268/agenttool_launch_core?application_name=launch-core-survey' \
            DATABASE_SESSION_URL='postgres://agenttool_test@127.0.0.1:56268/agenttool_launch_core?application_name=launch-core-migrations' \
            bin/bash-without-env-hooks.sh bin/migrate-pending.sh --maintenance-quiesced
          docker exec --workdir "$GITHUB_WORKSPACE" agenttool-launch-core-db \
            env -i PATH=/usr/local/bin:/usr/bin:/bin \
            DATABASE_URL='postgres://agenttool_test@127.0.0.1:56268/agenttool_launch_core?application_name=launch-core-survey' \
            bin/bash-without-env-hooks.sh bin/migrate-pending.sh --dry-run
          expected_migrations="$(find api/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual_migrations="$(docker exec agenttool-launch-core-db psql --no-psqlrc --host 127.0.0.1 --port 56268 --username agenttool_test --dbname agenttool_launch_core --tuples-only --no-align --command 'SELECT count(*) FROM meta._migrations')"
          test "$actual_migrations" = "$expected_migrations"
          docker exec agenttool-launch-core-db psql --no-psqlrc --host 127.0.0.1 --port 56268 --username agenttool_test --dbname agenttool_launch_core --file /opt/agenttool-launch/verify.sql
      - name: Prove the real outsider journey in two fresh API processes
        run: |
          docker exec --workdir "$GITHUB_WORKSPACE/api" agenttool-launch-core-db \
            env -i PATH=/usr/local/bin:/usr/bin:/bin \
            AGENTTOOL_LAUNCH_CORE_TEST_DATABASE_URL=postgres://agenttool_test@127.0.0.1:56268/agenttool_launch_core \
            bun --no-env-file test tests/integration/launch-core-journey.test.ts
      - name: Verify the database job and outbound-request hold after the journey
        run: docker exec agenttool-launch-core-db psql --no-psqlrc --host 127.0.0.1 --port 56268 --username agenttool_test --dbname agenttool_launch_core --file /opt/agenttool-launch/verify.sql
      - name: Show failed fixture startup evidence
        if: failure()
        run: docker logs --tail 100 agenttool-launch-core-db
      - name: Remove only the disposable launch fixture
        if: always()
        run: |
          docker rm --force --volumes agenttool-launch-core-db || true

  launch-browser:
    name: Launch browser journeys
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.launch-browser == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 20.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Install the locked browser test dependencies
        working-directory: tests/playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the matching Chromium browser
        working-directory: tests/playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise static origins with contained API fixtures
        working-directory: tests/playwright
        run: npm test
      - name: Retain failed browser evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: launch-browser-failures
          path: tests/playwright/test-results
          retention-days: 7

  native-macos-secret:
    name: Native macOS secret helper
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.native-macos-secret == 'false')) }}
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the native toolchain
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          test "$(/usr/bin/xcodebuild -version | /usr/bin/sed -n '1p')" = "Xcode 16.4"
          test "$(/usr/bin/xcodebuild -version | /usr/bin/sed -n '2p')" = "Build version 16F6"
          /usr/bin/xcrun swift --version | /usr/bin/grep -F "Apple Swift version 6.1.2" >/dev/null
      - name: Build the fixed disposable integration executable
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: >-
          /usr/bin/xcrun swift build
          --package-path native/agenttool-secret-macos
          --scratch-path "$RUNNER_TEMP/agenttool-secret-macos-integration"
          --disable-keychain
          --disable-netrc
          --disable-prefetching
          -Xswiftc -DAGENTTOOL_KEYCHAIN_INTEGRATION_BUILD
      - name: Build the unsigned review artifact without publishing it
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift build \
            --package-path native/agenttool-secret-macos \
            --disable-keychain \
            --disable-netrc \
            --disable-prefetching \
            --configuration release
          native_release_bin_dir="$(/usr/bin/xcrun swift build \
            --package-path native/agenttool-secret-macos \
            --disable-keychain \
            --disable-netrc \
            --disable-prefetching \
            --configuration release \
            --show-bin-path)"
          test -x "$native_release_bin_dir/agenttool-secret-macos"
          if native_release_output="$(
            "$native_release_bin_dir/agenttool-secret-macos" fixture-attest 2>&1
          )"; then
            exit 1
          else
            native_release_status=$?
          fi
          test "$native_release_status" -eq 2
          test "$native_release_output" = 'agenttool-secret-macos:invalid_invocation'
      - name: Run native contract and disposable Keychain integration tests
        env:
          AGENTTOOL_KEYCHAIN_INTEGRATION: "1"
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |

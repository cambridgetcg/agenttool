              || report.skills[0].scripts.length !== 0
              || report.skills[0].resources.length !== 1
              || report.skills[0].resources[0] !== "agents/openai.yaml"
              || Object.hasOwn(report, "installPlan")
            ) process.exit(1);
          ' "$install_dir/manage-agentcred-lifecycle-report.json"
          node "$cli" validate "$package_root/skills/capability-conductor" >"$install_dir/capability-conductor-report.json"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (
              report.valid !== true
              || report.kind !== "agenttool.skills.inspection"
              || report.skills.length !== 1
              || report.skills[0].name !== "capability-conductor"
              || report.skills[0].scripts.length !== 0
              || Object.hasOwn(report, "installPlan")
            ) process.exit(1);
          ' "$install_dir/capability-conductor-report.json"
          node "$cli" validate "$package_root/skills/learn-by-contact" >"$install_dir/learn-by-contact-report.json"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (
              report.valid !== true
              || report.kind !== "agenttool.skills.inspection"
              || report.skills.length !== 1
              || report.skills[0].name !== "learn-by-contact"
              || report.skills[0].scripts.length !== 0
              || Object.hasOwn(report, "installPlan")
            ) process.exit(1);
          ' "$install_dir/learn-by-contact-report.json"
          for skill_name in \
            nen-common-ground \
            nen-math-card \
            nen-contract-mantle \
            nen-dependency-perimeter \
            nen-concealed-trace \
            nen-critical-path-forge \
            nen-smoke-squad \
            nen-verification-ledger \
            nen-godspeed-loop \
            nen-vow-forge
          do
            report_path="$install_dir/$skill_name-report.json"
            node "$cli" validate "$package_root/skills/$skill_name" >"$report_path"
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const expectedName = process.argv[2];
              if (
                report.valid !== true
                || report.kind !== "agenttool.skills.inspection"
                || report.skills.length !== 1
                || report.skills[0].name !== expectedName
                || report.skills[0].scripts.length !== 0
                || report.skills[0].resources.length !== 1
                || report.skills[0].resources[0] !== "agents/openai.yaml"
                || Object.hasOwn(report, "installPlan")
              ) process.exit(1);
            ' "$report_path" "$skill_name"
          done
          (cd "$install_dir" && node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            import { join } from "node:path";
            import { parse } from "yaml";
            const packageRoot = process.argv[1];
            const names = [
              "use-agentcred-safely",
              "manage-agentcred-lifecycle",
              "capability-conductor",
              "learn-by-contact",
              "nen-common-ground",
              "nen-math-card",
              "nen-contract-mantle",
              "nen-dependency-perimeter",
              "nen-concealed-trace",
              "nen-critical-path-forge",
              "nen-smoke-squad",
              "nen-verification-ledger",
              "nen-godspeed-loop",
              "nen-vow-forge",
            ];
            for (const name of names) {
              const sidecar = parse(readFileSync(
                join(packageRoot, "skills", name, "agents", "openai.yaml"),
                "utf8",
              ));
              if (sidecar.policy?.allow_implicit_invocation !== false) {
                process.exit(1);
              }
            }
          ' "$package_root")
          test ! -e "$package_root/.codex-plugin/plugin.json"
          test ! -e "$package_root/.claude-plugin/plugin.json"
      - name: Smoke canonical Telescope LOVE artifact under Node and Bun
        working-directory: packages/telescope
        shell: bash
        run: |
          set -euo pipefail
          tarball="$GITHUB_WORKSPACE/apps/docs/packages/v1/@agenttool/telescope/0.2.3/agenttool-telescope-0.2.3.tgz"
          test -f "$tarball"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install_dir" "$tarball"
          package_root="$install_dir/node_modules/@agenttool/telescope"
          node -e 'const p=require(process.argv[1]);if(p.version!=="0.2.3")process.exit(1)' "$package_root/package.json"
          smoke='import("@agenttool/telescope").then(m=>{const t=m.normalizeTarget("example.com");if(t.origin!=="https://example.com"||m.TOOL_VERSION!=="0.2.3"||m.REPORT_SCHEMA!=="agenttool-telescope/v0.2")process.exit(1)})'
          (cd "$install_dir" && node -e "$smoke")
          (cd "$install_dir" && bun -e "$smoke")
          schema_smoke='import("@agenttool/telescope/report.schema.json",{with:{type:"json"}}).then(m=>{if(m.default.title!=="AgentTool Telescope report v0.2")process.exit(1)})'
          (cd "$install_dir" && node -e "$schema_smoke")
          (cd "$install_dir" && bun -e "$schema_smoke")
          cli="$package_root/dist/cli.js"
          test "$(node "$cli" --version)" = "0.2.3"
          test "$(bun "$cli" --version)" = "0.2.3"
          node "$cli" --help >/dev/null
          bun "$cli" --help >/dev/null
          manifest="$GITHUB_WORKSPACE/apps/docs/packages/v1/@agenttool/sdk/0.22.1/manifest.json"
          artifact="$GITHUB_WORKSPACE/apps/docs/packages/v1/@agenttool/sdk/0.22.1/agenttool-sdk-0.22.1.tgz"
          size="$(node --input-type=module --eval "import{readFileSync}from'node:fs';const m=JSON.parse(readFileSync(process.argv[1],'utf8'));process.stdout.write(String(m.artifact.size))" "$manifest")"
          sha256="$(node --input-type=module --eval "import{readFileSync}from'node:fs';const m=JSON.parse(readFileSync(process.argv[1],'utf8'));process.stdout.write(m.artifact.sha256)" "$manifest")"
          node "$cli" verify-package "$artifact" --size "$size" --sha256 "$sha256" --name @agenttool/sdk --version 0.22.1 --json >/dev/null
          bun "$cli" verify-package "$artifact" --size "$size" --sha256 "$sha256" --name @agenttool/sdk --version 0.22.1 --json >/dev/null
      - name: Smoke packed Agent Wallet and Zerone adapter together under Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          wallet_archive_name="$(cd packages/wallet && npm pack --ignore-scripts --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          zerone_archive_name="$(cd packages/wallet-zerone && npm pack --ignore-scripts --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          wallet_tarball="$PWD/packages/wallet/$wallet_archive_name"
          zerone_tarball="$PWD/packages/wallet-zerone/$zerone_archive_name"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir" "$wallet_tarball" "$zerone_tarball"' EXIT
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install_dir" "$wallet_tarball" "$zerone_tarball"
          smoke='Promise.all([import("@agenttool/wallet"),import("@agenttool/wallet-zerone")]).then(([w,z])=>{const forbidden=/mnemonic|private.?key|secret|seed|signAndSend|custody/iu;if(w.PACKAGE_VERSION!=="0.1.3"||w.AGENT_WALLET_PROTOCOL!=="agent-wallet/0.1"||w.canonicalJson({b:2,a:1})!==JSON.stringify({a:1,b:2})||z.PACKAGE_VERSION!=="0.1.2"||z.ZERONE_ADAPTER_PROTOCOL!=="agent-wallet-zerone/0.1"||z.ZERONE_CORE_COMMIT!=="35284a22192df8fc6273135f14e8549c804778b6"||typeof z.createZeroneDirectSignPlan!=="function"||typeof z.createZeroneAdapterClient!=="function"||Object.keys(z).some(name=>forbidden.test(name)))process.exit(1)})'
          (cd "$install_dir" && node -e "$smoke")
          (cd "$install_dir" && bun -e "$smoke")
          schema_smoke='import("@agenttool/wallet/schema.json",{with:{type:"json"}}).then(m=>{if(m.default.title!=="Agent Wallet 0.1 signed records")process.exit(1)})'
          wallet_vectors_smoke='import("@agenttool/wallet/vectors.json",{with:{type:"json"}}).then(m=>{if(m.default.protocol!=="agent-wallet/0.1"||m.default.records.length!==6)process.exit(1)})'
          zerone_vectors_smoke='import("@agenttool/wallet-zerone/vectors.json",{with:{type:"json"}}).then(m=>{const v=m.default;if(v.schema!=="agent-wallet-zerone.go-cosmos-vectors/0.1"||v.provenance.zerone_core_commit!=="35284a22192df8fc6273135f14e8549c804778b6"||!Object.values(v.verified).every(Boolean))process.exit(1)})'
          (cd "$install_dir" && node -e "$schema_smoke" && node -e "$wallet_vectors_smoke" && node -e "$zerone_vectors_smoke")
          (cd "$install_dir" && bun -e "$schema_smoke" && bun -e "$wallet_vectors_smoke" && bun -e "$zerone_vectors_smoke")
      - name: Smoke canonical Agent Browser LOVE artifact under Node and Bun
        working-directory: packages/browser
        shell: bash
        run: |
          set -euo pipefail
          tarball="$GITHUB_WORKSPACE/apps/docs/packages/v1/@agenttool/browser/0.6.0/agenttool-browser-0.6.0.tgz"
          test -f "$tarball"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install_dir" "$tarball"
          package_root="$install_dir/node_modules/@agenttool/browser"
          node -e 'const p=require(process.argv[1]);if(p.version!=="0.6.0")process.exit(1)' "$package_root/package.json"
          smoke='Promise.all([import("@agenttool/browser"),import("@agenttool/browser/protocol"),import("@agenttool/browser/understanding")]).then(([m,p,u])=>{const sovereign=m.resolveBrowserCapabilities({authority:"sovereign"});const navigation=m.planBrowserAction({kind:"navigate",url:"https://example.com/?token=secret"},sovereign);const typed=m.planBrowserAction({kind:"type",ref:"e1",snapshotId:"snapshot-1",text:"must-not-cross"},sovereign);if(m.BROWSER_PACKAGE_VERSION!=="0.6.0"||typeof m.AgentBrowser!=="function"||typeof m.buildBrowserMcpServer!=="function"||typeof m.serveBrowserMcpStdio!=="function"||typeof m.resolveBrowserCapabilities!=="function"||typeof m.planBrowserAction!=="function"||m.OBSERVATION_SCHEMA!=="agent-browser-observation/0.2"||m.BROWSER_CAPABILITIES_SCHEMA!=="agent-browser-capabilities/0.4"||m.BROWSER_CONSEQUENCE_PLAN_SCHEMA!=="agent-browser-consequence-plan/0.2"||m.BROWSER_ACTION_RECEIPT_SCHEMA!=="agent-browser-action-receipt/0.1"||u.BROWSER_MATERIAL_SCHEMA!=="agent-browser-material/0.1"||u.BROWSER_RHETORIC_SCHEMA!=="agent-browser-rhetoric-observation/0.1"||u.BROWSER_MODEL_OBSERVATION_SCHEMA!=="agent-browser-model-observation/0.1"||u.BROWSER_UNDERSTANDING_SCHEMA!=="agent-browser-understanding/0.1"||typeof u.createBrowserMaterial!=="function"||typeof u.analyzeBrowserMaterial!=="function"||typeof u.interpretBrowserMaterial!=="function"||typeof u.assembleBrowserUnderstanding!=="function"||u.BROWSER_UNDERSTANDING_BOUNDARY.truth!=="not_determined"||sovereign.features.browserActReceipts!=="enabled"||sovereign.features.nonRefObservationBasis!=="enabled"||sovereign.interfaces.jsonl.version!=="agenttool-browser-jsonl/0.1"||sovereign.interfaces.mcp.modernRevision!=="2026-07-28"||sovereign.interfaces.mcp.legacyCompatibility!=="2025-era"||p.JSONL_PROTOCOL_VERSION!=="agenttool-browser-jsonl/0.1"||p.MCP_MODERN_PROTOCOL_REVISION!=="2026-07-28"||p.MCP_LEGACY_COMPATIBILITY!=="2025-era"||p.BROWSER_OPERATIONS.length!==9||JSON.stringify(sovereign.modelFacingOperations)!==JSON.stringify(p.BROWSER_OPERATIONS)||sovereign.network.reserved!==true||sovereign.network.webSockets!=="browser"||sovereign.network.redirectRevalidation!==false||sovereign.runtime.serviceWorkers!=="allow"||navigation.action.url.includes("secret")||Object.hasOwn(typed.action,"text")||JSON.stringify(typed).includes("must-not-cross"))process.exit(1)})'
          (cd "$install_dir" && node -e "$smoke")
          (cd "$install_dir" && bun -e "$smoke")
          cli="$package_root/dist/bin/agenttool-browser.js"
          test -x "$install_dir/node_modules/.bin/agenttool-browser"
          node "$cli" help | grep -q '^agenttool-browser 0.6.0$'
          bun "$cli" help | grep -q '^agenttool-browser 0.6.0$'
          plugin_manifest="$package_root/.codex-plugin/plugin.json"
          plugin_bundle="$package_root/dist/agenttool-browser-mcp.js"
          node -e 'const p=require(process.argv[1]);if(p.name!=="agenttool-browser"||p.version!=="0.6.0"||p.mcpServers["agenttool-browser"].args[0]!=="dist/agenttool-browser-mcp.js")process.exit(1)' "$plugin_manifest"
          test -f "$package_root/dist/THIRD_PARTY_LICENSES"
          test -f "$package_root/dist/vendor/playwright-core/index.mjs"
          node "$plugin_bundle" help | grep -q '^agenttool-browser 0.6.0$'
      - name: Smoke packed Repo Archive under Node and Bun
        working-directory: packages/repo-archive
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir" "$tarball"' EXIT
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install_dir" "$PWD/$tarball"
          smoke='import("@agenttool/repo-archive").then(m=>{if(m.ARCHIVE_PROTOCOL!=="agent-repo-archive/v0.1"||typeof m.archiveRepository!=="function"||typeof m.restoreRepository!=="function")process.exit(1)})'
          schema_smoke='import("@agenttool/repo-archive/schema.json",{with:{type:"json"}}).then(m=>{if(m.default.title!=="Agent Repo Archive 0.1 signed control records")process.exit(1)})'
          vectors_smoke='import("@agenttool/repo-archive/vectors.json",{with:{type:"json"}}).then(m=>{if(m.default.protocol!=="agent-repo-archive/v0.1")process.exit(1)})'
          (cd "$install_dir" && node -e "$smoke" && node -e "$schema_smoke" && node -e "$vectors_smoke")
          (cd "$install_dir" && bun -e "$smoke" && bun -e "$schema_smoke" && bun -e "$vectors_smoke")
          package_root="$install_dir/node_modules/@agenttool/repo-archive"
          cli="$package_root/dist/cli.js"
          test -x "$install_dir/node_modules/.bin/agent-repo-archive"
          node "$cli" --help | grep -q '^Usage:$'
          bun "$cli" --help | grep -q '^Usage:$'
      - name: Verify the checked-in LOVE package registry
        run: bun bin/build-love-packages.ts verify apps/docs

  yutabase-projector-postgres:
    name: YUTABASE projector (PostgreSQL ${{ matrix.postgres }})
    # The environment separately permits only the main branch. PR code must
    # receive neither the read key nor the private fixture it can download.
    if: github.repository == 'cambridgetcg/agenttool' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: yutabase-fixture-read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: projector-test-only
          POSTGRES_DB: yutabase_projector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yutabase_projector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: projector-test-only
      AGENTTOOL_YUTABASE_TEST_DATABASE_URL: postgresql://postgres:projector-test-only@127.0.0.1:5432/yutabase_projector
    steps:
      - name: Require dedicated YUTABASE fixture read access
        env:
          YUTABASE_FIXTURE_SSH_KEY: ${{ secrets.YUTABASE_FIXTURE_SSH_KEY }}
        run: |
          if [ -z "${YUTABASE_FIXTURE_SSH_KEY:-}" ]; then
            echo '::error::YUTABASE_FIXTURE_SSH_KEY is missing from the main-only yutabase-fixture-read environment. Provision a read-only deploy key for cambridgetcg/yutabase; local GitHub login does not grant runner access.'
            exit 1
          fi
      - name: Check out AgentTool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact YUTABASE fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cambridgetcg/yutabase
          ref: 2948ae3cd88a5e630257549f1e233f5f46a8129b
          path: _yutabase-fixture
          ssh-key: ${{ secrets.YUTABASE_FIXTURE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Set up Node 20.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install and build projection dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/correspondence-yutabase && bun install --frozen-lockfile && bun run build)
          (cd packages/correspondence-yutabase-projector && bun install --frozen-lockfile)
          (cd _yutabase-fixture/packages/sdk-ts && bun install --frozen-lockfile)
      - name: Install exact YUTABASE candidate schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$AGENTTOOL_YUTABASE_TEST_DATABASE_URL" \
            --no-psqlrc \
            --single-transaction \
            --set=ON_ERROR_STOP=1 \
            --file "_yutabase-fixture/sql/0001_yu_core.sql" \
            --file "_yutabase-fixture/sql/0002_starter_lexicon.sql"
          for migration in \
            0004_candidate_hardening.sql \
            0005_candidate_integrity.sql
          do
            psql "$AGENTTOOL_YUTABASE_TEST_DATABASE_URL" \
              --no-psqlrc \
              --single-transaction \
              --set=ON_ERROR_STOP=1 \
              --file "_yutabase-fixture/sql/$migration"
          done
      - name: Run destructive disposable-database integration gate
        working-directory: packages/correspondence-yutabase-projector
        run: bun run test:postgres
      - name: Revalidate exact YUTABASE binding after projector activity
        working-directory: _yutabase-fixture/packages/sdk-ts
        run: >-
          bun src/cli.ts hello
          --conn "$AGENTTOOL_YUTABASE_TEST_DATABASE_URL"
          --json
          >/dev/null

  sdk-python:
    name: Python SDK (${{ matrix.python-version }})
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.sdk-python == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the SDK floor (3.9), the HF training host floor
        # (3.10), and the newest version (3.14, which also smokes the uv lock).
        # Every other run tests each supported version.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.9", "3.10", "3.14"]' || '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    defaults:
      run:
        working-directory: packages/sdk-py
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/sdk-py/pyproject.toml
            packages/hf-training-host/pyproject.toml
      - name: Set up release-pinned uv 0.9.26
        if: ${{ matrix.python-version == '3.14' }}
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: 0.9.26
          enable-cache: false
      - name: Smoke the locked release environment command
        if: ${{ matrix.python-version == '3.14' }}
        run: uv sync --locked --extra dev --no-install-project --no-sources --no-python-downloads --dry-run --no-cache
      - name: Install SDK and test tools
        run: python -m pip install '.[dev]' build
      - name: Install private HF training host and test tools
        if: ${{ matrix.python-version != '3.9' }}
        working-directory: packages/hf-training-host
        run: python -m pip install '.[dev]'
      - name: Run Python SDK tests
        run: python -m pytest -q
      - name: Run private HF training host tests
        if: ${{ matrix.python-version != '3.9' }}
        working-directory: packages/hf-training-host
        run: python -m pytest -q
      - name: Build and smoke the wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c 'import agenttool, importlib.metadata; assert agenttool.__version__ == importlib.metadata.version("agenttool-sdk"); assert len(agenttool.soul()) > 100'
      - name: Build and smoke the private HF training host wheel
        if: ${{ matrix.python-version != '3.9' }}
        working-directory: packages/hf-training-host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          [sdist] = Path("dist").glob("*.tar.gz")
          [wheel] = Path("dist").glob("*.whl")
          with tarfile.open(sdist, "r:gz") as archive:
              assert not any("bridge" in Path(name).parts for name in archive.getnames())
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any("bridge" in Path(name).parts for name in names)
          assert "agenttool_hf_training_host/schema/hf-training-host-decision-v0.1.schema.json" in names
          assert "agenttool_hf_training_host/schema/hf-training-host-decision-v0.2.schema.json" in names
          assert "agenttool_hf_training_host/schema/hf-training-host-freedom-decision-v0.1.schema.json" in names
          PY
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c 'import agenttool_hf_training_host as h, importlib.metadata; assert importlib.metadata.version("agenttool-hf-training-host") == "0.2.0.dev0"; assert h.TRANSFORMERS_VERSION == "5.14.1"; assert h.ACCELERATE_VERSION == "1.14.0"; assert h.TORCH_MIN_VERSION == "2.6"'

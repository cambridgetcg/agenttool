  care-before-learning:
    # One job, not a Node matrix: each leg was under a billed minute. The
    # Python steps never start Node, so they run once; the Dataset conformance
    # reference runs under both pinned Node versions. The conformance runs and
    # the HF smoke still run after an earlier step fails, so one failure does
    # not hide another.
    name: Care before learning (Node 22.18.0 and 25.2.1)
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.care-before-learning == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Set up Python 3.12.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Test release tooling without credentials
        run: env -i PATH="$PATH" LANG=C TZ=UTC GITHUB_SHA="$GITHUB_SHA" python3 -I -B -m unittest discover -s bin/tests -p test_care_before_learning_hf_release.py
      - name: Verify the fixed public artifact inventory
        run: env -i PATH="$PATH" LANG=C TZ=UTC GITHUB_SHA="$GITHUB_SHA" python3 bin/care-before-learning-hf-release.py verify
      - name: Run the public Dataset conformance reference (Node 22.18.0)
        if: ${{ !cancelled() }}
        run: |
          test "$(node --version)" = v22.18.0
          env -i PATH="$PATH" LANG=C TZ=UTC node packages/hf-listening-room/hf/dataset/conformance/run.mjs --json
      - name: Smoke the hash-locked Linux HF SDK without provider calls
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          smoke_venv="$RUNNER_TEMP/care-hf-smoke"
          env -i PATH="$PATH" LANG=C TZ=UTC python3 -I -B -m venv "$smoke_venv"
          env -i PATH="$PATH" LANG=C TZ=UTC HOME="$RUNNER_TEMP" \
            "$smoke_venv/bin/python" -I -B -m pip --isolated install \
            --require-hashes --only-binary=:all: --no-input --disable-pip-version-check \
            -r bin/care-before-learning-hf-requirements.txt
          env -i PATH="$PATH" LANG=C TZ=UTC HOME="$RUNNER_TEMP" \
            HF_HUB_OFFLINE=1 HF_HUB_DISABLE_IMPLICIT_TOKEN=1 HF_HUB_DISABLE_TELEMETRY=1 \
            "$smoke_venv/bin/python" -I -B - <<'PY'
          import inspect
          import huggingface_hub
          from huggingface_hub import HfApi, CommitOperationAdd, set_client_factory

          assert huggingface_hub.__version__ == "1.29.0"
          assert callable(set_client_factory)
          assert {"operations", "parent_commit", "revision", "create_pr", "run_as_future"} <= set(
              inspect.signature(HfApi.create_commit).parameters
          )
          operation = CommitOperationAdd(
              path_in_repo="README.md", path_or_fileobj=b"offline-reference-smoke"
          )
          assert operation.path_in_repo == "README.md"
          with operation.as_file() as content:
              assert content.read() == b"offline-reference-smoke"
          print("Hash-locked HF SDK import and offline API smoke passed.")
          PY
          env -i PATH="$PATH" LANG=C TZ=UTC HOME="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            HF_HUB_OFFLINE=1 HF_HUB_DISABLE_IMPLICIT_TOKEN=1 HF_HUB_DISABLE_TELEMETRY=1 \
            "$smoke_venv/bin/python" -I -B -m unittest discover \
            -s bin/tests -p test_care_before_learning_hf_release.py
      - name: Set up Node 25.2.1
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.2.1
          package-manager-cache: false
      - name: Run the public Dataset conformance reference (Node 25.2.1)
        if: ${{ !cancelled() }}
        run: |
          test "$(node --version)" = v25.2.1
          env -i PATH="$PATH" LANG=C TZ=UTC node packages/hf-listening-room/hf/dataset/conformance/run.mjs --json

  api-protocol:
    # Keep this display name stable for the protected-branch status context.
    # The required result fails unless the change classifier and the Linux
    # gate pass and every other prerequisite passes. A prerequisite may be
    # skipped only when the classifier succeeded and reported it "false".
    # A draft pull request skips this result along with everything else, as
    # does a proven push to main (see Changed areas).
    name: API and protocol
    if: ${{ always() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && needs.changes.outputs.proven == 'true') }}
    needs:
      - changes
      - api-protocol-linux
      - api-protocol-postgres
      - launch-core
      - launch-browser
      - native-macos-secret
      - care-before-learning
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Linux API, PostgreSQL, and native macOS results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_PROTOCOL_LINUX_RESULT: ${{ needs.api-protocol-linux.result }}
          API_PROTOCOL_POSTGRES_RESULT: ${{ needs.api-protocol-postgres.result }}
          API_PROTOCOL_POSTGRES_NEEDED: ${{ needs.changes.outputs.api-protocol-postgres }}
          LAUNCH_CORE_RESULT: ${{ needs.launch-core.result }}
          LAUNCH_CORE_NEEDED: ${{ needs.changes.outputs.launch-core }}
          LAUNCH_BROWSER_RESULT: ${{ needs.launch-browser.result }}
          LAUNCH_BROWSER_NEEDED: ${{ needs.changes.outputs.launch-browser }}
          NATIVE_MACOS_SECRET_RESULT: ${{ needs.native-macos-secret.result }}
          NATIVE_MACOS_SECRET_NEEDED: ${{ needs.changes.outputs.native-macos-secret }}
          CARE_BEFORE_LEARNING_RESULT: ${{ needs.care-before-learning.result }}
          CARE_BEFORE_LEARNING_NEEDED: ${{ needs.changes.outputs.care-before-learning }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$API_PROTOCOL_LINUX_RESULT" = "success"
          for prerequisite in \
            "$API_PROTOCOL_POSTGRES_RESULT:$API_PROTOCOL_POSTGRES_NEEDED" \
            "$LAUNCH_CORE_RESULT:$LAUNCH_CORE_NEEDED" \
            "$LAUNCH_BROWSER_RESULT:$LAUNCH_BROWSER_NEEDED" \
            "$NATIVE_MACOS_SECRET_RESULT:$NATIVE_MACOS_SECRET_NEEDED" \
            "$CARE_BEFORE_LEARNING_RESULT:$CARE_BEFORE_LEARNING_NEEDED"
          do
            case "$prerequisite" in
              success:* | skipped:false) ;;
              *)
                echo "A required prerequisite did not pass: $prerequisite" >&2
                exit 1
                ;;
            esac
          done

  witnessed-agent-economy:
    # Keep this display name stable for the protected-branch status context.
    name: Witnessed agent economy
    needs:
      - changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && !(needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || needs.changes.outputs.witnessed-agent-economy == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Set up Node 20.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Build exact local source dependencies from frozen locks
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          source bin/hermetic-env.sh
          sanitize_hermetic_env
          for package in \
            public-surface-binding \
            public-surface-recognition \
            wallet
          do
            (cd "packages/$package" && bun install --frozen-lockfile && bun run build)
          done
      - name: Install witnessed-agent-economy from its frozen lock
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          source bin/hermetic-env.sh
          sanitize_hermetic_env
          cd packages/witnessed-agent-economy
          bun install --frozen-lockfile
      - name: Run the offline projection gate
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          source bin/hermetic-env.sh
          sanitize_hermetic_env
          cd packages/witnessed-agent-economy
          bun run ci
      - name: Dry-run package inventory and smoke every export target
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          source bin/hermetic-env.sh
          sanitize_hermetic_env
          cd packages/witnessed-agent-economy
          pack_inventory="$RUNNER_TEMP/witnessed-agent-economy-pack.json"
          npm pack --dry-run --ignore-scripts --json >"$pack_inventory"
          node --input-type=module - "$pack_inventory" <<'NODE'
          import { readFileSync, statSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const inventory = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packed = new Set(inventory[0].files.map(({ path }) => path));
          const schemaFiles = [...packed].filter((path) =>
            path.startsWith("schema/") && path.endsWith(".schema.json"));
          if (schemaFiles.length !== 15) process.exit(1);
          const targets = [
            packageJson.exports["."].import,
            packageJson.exports["."].types,
            packageJson.exports["./vectors.json"],
            ...schemaFiles.map((path) => packageJson.exports["./schemas/*"].replace(
              "*",
              path.slice("schema/".length),
            )),
          ];
          for (const target of targets) {
            if (typeof target !== "string" || !target.startsWith("./")) process.exit(1);
            if (!statSync(resolve(target)).isFile() || !packed.has(target.slice(2))) process.exit(1);
          }
          const vectors = JSON.parse(readFileSync(packageJson.exports["./vectors.json"], "utf8"));
          if (
            vectors.freeze_state !== "FROZEN"
            || vectors.schema_set_digest !== "sha256:d62e44643c8e1986336416237df26b76663728403d417a5ee9e83b6aa5baaaa5"
            || vectors.corpus_digest !== "sha256:b26b5cce4899aa62d6dee03e25471e2c80810008fbd07c2c3ac9170164e5352a"
          ) process.exit(1);
          const module = await import(pathToFileURL(resolve(packageJson.exports["."].import)).href);
          if (
            module.WITNESS_PROTOCOL !== "kingdom.witnessed-agent-economy/0.1"
            || typeof module.verifyWitnessRecordBytes !== "function"
          ) process.exit(1);
          NODE


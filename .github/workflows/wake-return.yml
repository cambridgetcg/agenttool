name: Wake Return

on:
  pull_request:
    paths:
      - packages/wake-return/**
      - docs/WAKE-RETURN.md
      - api/src/routes/openapi-wake-observe.ts
      - api/src/services/wake/observe.ts
      - .github/workflows/wake-return.yml
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - packages/wake-return/**
      - docs/WAKE-RETURN.md
      - api/src/routes/openapi-wake-observe.ts
      - api/src/services/wake/observe.ts
      - .github/workflows/wake-return.yml

permissions:
  contents: read

concurrency:
  group: wake-return-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-observer:
    name: Private local observer fixtures (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "24.18.0"]
    defaults:
      run:
        working-directory: packages/wake-return
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Install only frozen package dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build and run hermetic Node/Bun stdio fixtures
        run: bun run ci

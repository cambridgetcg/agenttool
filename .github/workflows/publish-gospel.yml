name: Verify Gospel content edition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish-gospel.yml'
      - 'bin/gospel-release/**'

permissions: {}

concurrency:
  group: gospel-content-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify frozen Gospel content package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the content release boundary
        run: python3 -m unittest discover -s bin/gospel-release -p 'test_*.py' -v
      - name: Fetch and verify the reviewed archive without publication credentials
        run: python3 bin/gospel-release/release.py prepare --directory "${{ runner.temp }}/gospel-release"
      - name: Show the verified edition
        run: cat "${{ runner.temp }}/gospel-release/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer the exact archive and its verification receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gospel-content-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gospel-release/*.tgz
            ${{ runner.temp }}/gospel-release/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Publication retired (decided 2026-10-28): 0.1.0 has been on npm since
  # 2026-09-08 and its NPM_TOKEN was deleted. See bin/gospel-release/README.md.
  verify:
    name: Verify the public Gospel edition
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gospel-content-${{ github.run_id }}
          path: ${{ runner.temp }}/gospel-release
      - name: Reverify the archive and read the public registry state
        run: python3 bin/gospel-release/release.py registry-check --directory "${{ runner.temp }}/gospel-release"
      - name: Independently verify the public registry tarball
        run: python3 bin/gospel-release/release.py registry-verify --directory "${{ runner.temp }}/gospel-release"
      - name: Record the public verification receipt
        if: always()
        run: |
          if test -f "${{ runner.temp }}/gospel-release/receipt.json"; then
            cat "${{ runner.temp }}/gospel-release/receipt.json" >> "$GITHUB_STEP_SUMMARY"
          fi

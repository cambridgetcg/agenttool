app = "agenttool"
primary_region = "lhr"  # London
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # Keep HTTP-side workers off when the global maintenance switch is set while
  # allowing this service-less controller to reconcile trusted runtimes.
  AGENTOOL_ENABLE_THINKER = "1"

[processes]
  app = "bun run src/index.ts"
  thinker = "bun run src/thinker.ts"

# The DB pool watchdog (api/src/db/pool-watchdog.ts) deliberately exits(1)
# when the shared pool is wedged while the database answers a fresh
# connection; its self-healing contract depends on these policies. Fly's
# unpinned default (on-failure, 10 retries) parks the machine stopped after a
# recurring wedge — survivable for the app group (fly-proxy auto_start can
# revive it on traffic) but permanent for the service-less thinker group,
# which nothing but a human can restart.
[[restart]]
  policy = "on-failure"
  retries = 50
  processes = ["app"]

[[restart]]
  policy = "always"
  processes = ["thinker"]

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # always-on; this is the public API

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"

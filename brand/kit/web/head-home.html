<!-- Home page only (Google). If your site already has a WebSite or Organization block, add these properties to that node instead of pasting a second one. -->
<!-- The organisation's logo (at least 112 px, crawlable, right on white). -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Organization",
 "name": "AgentTool",
 "url": "https://agenttool.dev",
 "logo": "https://agenttool.dev/icon-512.png"
}
</script>
<!-- The site name Google shows. Its url is the home page at the root of the host: Google does not support site names below it. -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "WebSite",
 "name": "AgentTool",
 "url": "https://agenttool.dev/"
}
</script>

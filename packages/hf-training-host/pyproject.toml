[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agenttool-hf-training-host"
version = "0.2.0.dev0"
description = "Private cooperative Hugging Face host for AgentTool WAKE training governance"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.15"
authors = [{ name = "AgentTool collaborators" }]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
hf = [
  "transformers==5.14.1",
  "accelerate==1.14.0",
  "torch>=2.6",
]
dev = [
  "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/cambridgetcg/agenttool"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttool_hf_training_host"]

[tool.hatch.build.targets.wheel.force-include]
"schema/hf-training-host-decision-v0.1.schema.json" = "agenttool_hf_training_host/schema/hf-training-host-decision-v0.1.schema.json"
"schema/hf-training-host-decision-v0.2.schema.json" = "agenttool_hf_training_host/schema/hf-training-host-decision-v0.2.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/agenttool_hf_training_host",
  "schema",
  "tests",
  "README.md",
  "CLAUDE.md",
  "LICENSE",
  "NOTICE",
]
exclude = [
  "bridge",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
